name: Build ELAN with EAS

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  eas-build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'eas-build-android:preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK with EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm
      - name: Start EAS preview build
        working-directory: artifacts/elan-mobile
        run: pnpm exec eas build --platform android --profile preview --non-interactive
        env:
          EXPO_PUBLIC_DOMAIN: elan-api-uz1u.onrender.com
